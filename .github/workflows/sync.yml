name: Sync

# Manual only until the owner has reviewed the dashboard and confirmed the schedule (Phase 4, gate G2).
# To schedule later, add:   schedule: [{cron: "0 3 * * *"}]   and set the repository variable SPOTISORT_SCHEDULED_APPLY=true.
#
# `vars.SPOTISORT_CRON` (a repository *variable*, not a secret) is informational only right now: this workflow
# has no `schedule:` trigger yet, so nothing runs automatically. Setting it lets `src.sync --cron` describe the
# intended schedule on the dashboard Overview ("Next scheduled run: ..."). Add the real `schedule:` trigger above
# once the owner confirms the cron time (decision 34/master decision 5).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes). Untick only after reviewing the dashboard."
        type: boolean
        default: true
      newest:
        description: "Only touch the N newest liked songs (REQUIRED for a live run)"
        type: string
        default: ""
      max_moves:
        description: "Abort if the plan has more moves than this"
        type: string
        default: "50"

concurrency:
  group: spotisort-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      NEWEST: ${{ inputs.newest }}
      MAX_MOVES: ${{ inputs.max_moves }}
      SPOTISORT_CRON: ${{ vars.SPOTISORT_CRON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      # The enrichment cache is NOT committed: it lists your whole library. A unique key per run lets the cache
      # be updated; restore-keys brings back the newest earlier one.
      - name: Restore enrichment cache
        uses: actions/cache@v4
        with:
          path: .cache/enrichment.json
          key: enrichment-v1-${{ github.run_id }}
          restore-keys: |
            enrichment-v1-

      - name: Check configuration exists
        run: |
          test -f config.yaml || { echo "config.yaml is missing. Create it with the Configure page and commit it."; exit 1; }
          python -c "from src.config import load_config; load_config('config.yaml'); print('config.yaml is valid')"

      - name: Sync
        env:
          # Only this step (the one that produces logs the next step commits) marks itself as a "committed run",
          # so logging.include_track_names is honoured only for output that is actually about to be published.
          SPOTISORT_COMMITTED_RUN: "1"
        run: |
          set -euo pipefail
          args=(--config config.yaml --max-moves "${MAX_MOVES:-50}")
          if [ -n "${SPOTISORT_CRON:-}" ]; then
            args+=(--cron "${SPOTISORT_CRON}")
          fi
          if [ "${DRY_RUN:-true}" != "true" ]; then
            args+=(--apply)
            [ -n "${NEWEST:-}" ] || { echo "A live run needs the 'newest' input (it never touches your whole library)."; exit 2; }
            args+=(--newest "$NEWEST")
          fi
          python -m src.sync "${args[@]}"

      - name: Extract journal for artifact upload
        # Journal durability (decision 33): the run's journal (list of removals, needed for --restore) is also
        # inside the committed logs/YYYY-MM-DD*.json log. We extract it into its own small file here and upload
        # THAT as a private Actions artifact, rather than uploading the whole log file, so the artifact stays
        # small and focused on the one thing it exists to protect (the restore journal), independent of whether
        # the log commit-back step below succeeds.
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=(logs/20*.json)
          mkdir -p logs/journal-artifact
          if [ "${#logs[@]}" -gt 0 ]; then
            latest="$(ls -t logs/20*.json | head -n1)"
            SPOTISORT_LATEST_LOG="$latest" python -c "import json, os; log = json.load(open(os.environ['SPOTISORT_LATEST_LOG'], encoding='utf-8')); journal = {'date': log.get('date'), 'run_id': log.get('run_id'), 'mode': log.get('mode'), 'restore_command': log.get('restore_command'), 'journal': log.get('journal', [])}; json.dump(journal, open('logs/journal-artifact/journal.json', 'w', encoding='utf-8'), indent=1)"
          else
            echo '{"journal": [], "note": "no run log was produced this run"}' > logs/journal-artifact/journal.json
          fi

      - name: Upload journal artifact
        # Uploading a workflow artifact only needs the default GITHUB_TOKEN read/write-artifacts permission,
        # which every run has automatically; it does not need `contents: write` the way the git push below
        # does, so this step can never conflict with (or depend on) the "Commit run logs" step succeeding.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: logs/journal-artifact/journal.json
          retention-days: 90

      - name: Commit run logs
        if: always()
        run: |
          set -euo pipefail
          git config user.name "spotisort-bot"
          git config user.email "spotisort-bot@users.noreply.github.com"
          shopt -s nullglob
          files=(logs/runs.json logs/latest-plan.json logs/20*.json)
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          if [ "${#existing[@]}" -gt 0 ]; then git add -f "${existing[@]}"; fi
          if git diff --cached --quiet; then
            echo "no log changes"
          else
            git commit -m "Update run logs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
